<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f8f5" />
    <title>オフラインです | 謝罪AI</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f8f5; --text: #1d2923; --muted: #536458; --card: #fff; --line: #d8e1d8; --accent: #173e32; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; padding: 24px; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.8 -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif; }
      main { width: min(100%, 460px); padding: 36px; border: 1px solid var(--line); border-radius: 28px; background: var(--card); text-align: center; }
      svg { width: 64px; height: 64px; margin-bottom: 12px; }
      h1 { font-size: 24px; letter-spacing: -.04em; line-height: 1.5; }
      p { color: var(--muted); }
      .sorry { color: var(--text); font-size: 18px; }
      a { display: block; margin-top: 24px; padding: 13px 20px; border-radius: 14px; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #78a76a; outline-offset: 5px; }
      small { display: block; margin-top: 24px; color: var(--muted); font-size: 12px; }
      @media (prefers-color-scheme: dark) { :root { --bg: #101a15; --text: #eef5ec; --muted: #b3c5b8; --card: #18251e; --line: #324738; --accent: #285841; } }
      @media (max-width: 360px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" role="img" aria-label="謝罪AIのアイコン"><rect width="64" height="64" rx="18" fill="#e3f1df"/><g transform="rotate(13 32 30)"><rect x="15" y="16" width="34" height="26" rx="10" fill="#173e32"/><circle cx="26" cy="30" r="2" fill="#e3f1df"/><circle cx="38" cy="30" r="2" fill="#e3f1df"/></g><path d="M22 49Q32 45 42 49" fill="none" stroke="#173e32" stroke-width="4" stroke-linecap="round"/></svg>
      <h1>接続できず、<br />すみませんでした。</h1>
      <p>オフライン用の準備がまだ終わっていないようです。通信環境を確認して、もう一度アプリを開いてください。</p>
      <p class="sorry">謝ることだけは、忘れていません。</p>
      <a href="/">もう一度開く</a>
      <small>謝罪AIは、生成AI API不使用のジョークアプリです。</small>
    </main>
  </body>
</html>
